    }</style><div id="logai-widget"><div id="logai-btn" onclick="toggleLogAI()"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></div><div id="logai-window"><div style="background: #2d3035; padding:20px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.1);"><div style="display:flex; align-items:center; gap:10px;"><div style="width:10px; height:10px; background:#28a745; border-radius:50%; box-shadow:0 0 10px #28a745;"></div><span style="font-weight:600; color:#fff; font-size:16px;">AI Ассистент</span></div><span onclick="toggleLogAI()" style="cursor:pointer; color:#fff; font-size:35px; line-height: 0.7; opacity: 0.7;">&times;</span></div><div id="logai-msgs" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; background:#3b3e45;"></div><div style="padding:15px; background:#2d3035; display:flex; gap:10px; align-items:flex-end; border-top: 1px solid rgba(255,255,255,0.1);"><textarea id="logai-input" rows="1" placeholder="Напишите..." oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea> <button id="logai-send-btn" onclick="sendLogAI()">➤</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>const API_URL = 'https://api.log-ai.ru';
    
       let logSid;
    try {
        logSid = localStorage.getItem('logai_sid');
        if (!logSid) {
            logSid = 's_' + Math.random().toString(36).substr(2, 12);
            localStorage.setItem('logai_sid', logSid);
        }
    } catch (e) {
        // Если доступ к памяти закрыт (инкогнито), создаем временный ID
        logSid = 'temp_' + Math.random().toString(36).substr(2, 12);
    }

    // Переименовали, чтобы избежать конфликтов
    let chatIsWaiting = false;
    let historyLoaded = false;
    let activeMessageId = null;
    let pollController = null;
    let pollTimeoutId = null;


    function toggleLogAI() {
        const w = document.getElementById('logai-window');
        const isOpen = (w.style.display === 'none' || w.style.display === '');
        if (isOpen) {
            w.style.display = 'flex';
            if (!historyLoaded) loadChatHistory();
        } else {
            w.style.display = 'none';
            stopPolling();
        }
    }

    function updateInputState() {
        const input = document.getElementById('logai-input');
        const btn = document.getElementById('logai-send-btn');
        if (input) {
            input.disabled = chatIsWaiting;
            input.style.opacity = chatIsWaiting ? '0.5' : '1';
        }
        if (btn) btn.style.opacity = chatIsWaiting ? '0.5' : '1';
    }

    function stopPolling() {
        if (pollController) pollController.abort();
        if (pollTimeoutId) clearTimeout(pollTimeoutId);
        
        pollController = null;
        pollTimeoutId = null;
        activeMessageId = null;
        chatIsWaiting = false;
        updateInputState();
    }

    function addLogMsg(txt, isAi) {
        const d = document.createElement('div');
        d.style = `padding:12px 16px; border-radius:18px; max-width:82%; font-size:14px; line-height:1.5; margin-bottom:10px; 
                   ${isAi ? 'align-self:flex-start; background:#4a4e56; color:#dbdee1; border-bottom-left-radius:4px;' 
                         : 'align-self:flex-end; background:#007bff; color:white; border-bottom-right-radius:4px; box-shadow:0 4px 12px rgba(0,123,255,0.25);'}`;

        if (txt === 'dots') {
            d.innerHTML = '<div class="logai-dots"><span></span><span></span><span></span></div>';
        } else {
            d.innerHTML = typeof marked !== 'undefined' ? marked.parse(txt) : txt;
        }

        const box = document.getElementById('logai-msgs');
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        return d;
    }

 async function loadChatHistory() {
    const box = document.getElementById('logai-msgs');
    try {
        const res = await fetch(`${API_URL}/history/${logSid}?platform=site`);
        const data = await res.json();

        box.innerHTML = '';

        if (Array.isArray(data) && data.length > 0) {
            data.forEach((m, index) => {
                // 1. Показываем сообщение пользователя
                if (m.message) {
                    addLogMsg(m.message, false);
                }

                // 2. Если есть готовый ответ — показываем
                if (m.answer) {
                    addLogMsg(m.answer, true);
                } 
                // 3. Если это ПОСЛЕДНЕЕ сообщение и ответа нет — включаем ожидание
                else if (m.message_id && index === data.length - 1) {
                    chatIsWaiting = true;
                    activeMessageId = m.message_id;
                    
                    const aiMsg = addLogMsg('dots', true);
                    startPolling(m.message_id, aiMsg); 
                }
            });
        } else {
            addLogMsg("Здравствуйте! Я ваш ИИ-ассистент. Чем могу помочь?", true);
        }

        historyLoaded = true;
        updateInputState();

    } catch (e) {
        console.error('History error:', e);
        addLogMsg("Не удалось загрузить историю чата", true);
    }
}
    async function sendLogAI() {
        if (chatIsWaiting) return;

        const input = document.getElementById('logai-input');
        const msg = input.value.trim();
        if (!msg) return;

        chatIsWaiting = true;
        updateInputState();

        addLogMsg(msg, false);
        
        // --- ВОТ ЭТИ ДВЕ СТРОКИ НУЖНО ДОБАВИТЬ ---
        input.value = ''; 
        input.style.height = 'auto'; 
        // ---------------------------------------

        const aiMsg = addLogMsg('dots', true);

        try {
            const res = await fetch(`${API_URL}/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: logSid,
                    message: msg,
                    clientId: 'web_user',
                    platform: 'site'
                })
            });


            const data = await res.json();

            if (data.blocked) {
                finish(data.message || "Сообщение заблокировано", aiMsg);
                return;
            }

            if (data.messageId) {
                activeMessageId = data.messageId;
                startPolling(data.messageId, aiMsg);
            } else {
                finish("Ошибка сервера", aiMsg);
            }
        } catch (e) {
            finish("Ошибка связи с сервером", aiMsg);
        }
    }

    function startPolling(messageId, aiMsg) {
        activeMessageId = messageId;
        pollController = new AbortController();
        let startTime = Date.now();
        let statusChanged = false; // Чтобы не менять текст постоянно

        const poll = async () => {
            if (activeMessageId !== messageId) return;

            const elapsed = (Date.now() - startTime) / 1000; // секунд прошло

            // 1. На 40-й секунде меняем текст на "Сложный вопрос"
            if (elapsed > 40 && !statusChanged) {
                const dots = aiMsg.querySelector('.logai-dots');
                aiMsg.innerHTML = '🤖 Вопрос сложный, анализирую данные...';
                if (dots) aiMsg.appendChild(dots); 
                statusChanged = true;
            }

            // 2. Лимит ожидания - 10 минут (600 секунд)
            if (elapsed > 600) {
                finish("🤖 Извините, ИИ перегружен или запрос слишком сложный. Пожалуйста, попробуйте позже.", aiMsg);
                return;
            }

            // 3. Умный интервал: до 50 сек — каждые 3 сек, потом — каждые 10 сек
            let nextInterval = (elapsed > 50) ? 10000 : 3000;

            try {
                const r = await fetch(`${API_URL}/get-answer/${messageId}`, { signal: pollController.signal });
                const d = await r.json();

                if (d.answer) {
                    finish(d.answer, aiMsg);
                } else {
                    pollTimeoutId = setTimeout(poll, nextInterval);
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    pollTimeoutId = setTimeout(poll, nextInterval);
                }
            }
        };
        poll();
    }

    function finish(text, msgElement) {
        if (msgElement) {
            msgElement.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text;
        }
        stopPolling();
    }

    // Enter для отправки
    document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('logai-input');
        if (input) {
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendLogAI();
                }
            });
        }
    });</script></body></html>
