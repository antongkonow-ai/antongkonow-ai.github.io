        for (var i = 0; i < images.length; i++) {
            if (images[i].complete) {
                images[i].classList.add('is-loaded');
            } else {
                images[i].addEventListener('load', function () {
                    this.classList.add('is-loaded');
                }, false);
            }
        }</script><script src="https://cdn.jsdelivr.net/npm/marked@4.0.12/lib/marked.min.js"></script><script>const API_URL = 'https://api.log-ai.ru'; 
    let logSid = localStorage.getItem('logai_sid') || 's_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('logai_sid', logSid);

    let isWaiting = false;
    let historyLoaded = false;
    let activeMessageId = null;
    let pollController = null;
    let pollTimeoutId = null;

    function toggleLogAI() {
        const w = document.getElementById('logai-window');
        const isOpen = (w.style.display === 'none' || w.style.display === '');
        if (isOpen) {
            w.style.display = 'flex';
            if (!historyLoaded) loadChatHistory();
        } else {
            w.style.display = 'none';
            stopPolling();
        }
    }

    function stopPolling() {
        if (pollController) pollController.abort();
        if (pollTimeoutId) clearTimeout(pollTimeoutId);
        pollController = null;
        pollTimeoutId = null;
        activeMessageId = null;
        isWaiting = false;
        
        // Разблокируем интерфейс
        const input = document.getElementById('logai-input');
        const btn = document.getElementById('logai-send-btn');
        if(input) { input.disabled = false; input.style.opacity = '1'; }
        if(btn) { btn.style.opacity = '1'; }
    }

    function addLogMsg(txt, isAi) {
        const d = document.createElement('div');
        d.style = `padding:12px 16px; border-radius:18px; max-width:82%; font-size:14px; line-height:1.5; margin-bottom:10px; ${isAi ? 'align-self:flex-start; background:#4a4e56; color:#dbdee1; border-bottom-left-radius:4px;' : 'align-self:flex-end; background:#007bff; color:white; border-bottom-right-radius:4px; box-shadow:0 4px 12px rgba(0,123,255,0.25);'}`;
        
        if (txt === 'dots') {
            d.innerHTML = '<div class="logai-dots"><span></span><span></span><span></span></div>';
        } else {
            d.innerHTML = typeof marked !== 'undefined' ? marked.parse(txt) : txt;
        }
        const box = document.getElementById('logai-msgs');
        box.appendChild(d);
        box.scrollTop = box.scrollHeight;
        return d;
    }

    // --- ФУНКЦИЯ ОТПРАВКИ (ИСПРАВЛЕНО) ---
    async function sendLogAI() {
        const input = document.getElementById('logai-input');
        const btn = document.getElementById('logai-send-btn');
        const msg = input.value.trim();

        if (!msg || isWaiting) return;

        isWaiting = true;
        input.value = '';
        input.style.height = 'auto';
        input.disabled = true;
        input.style.opacity = '0.5';
        btn.style.opacity = '0.5';

        addLogMsg(msg, false);
        const aiMsg = addLogMsg('dots', true);

        try {
            const response = await fetch(`${API_URL}/send`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: logSid,
                    message: msg,
                    platform: 'site',
                    clientId: 'web_user'
                })
            });

            const data = await response.json();

            if (data.blocked) {
                finish(data.message, aiMsg);
                return;
            }

            if (data.messageId) {
                activeMessageId = data.messageId;
                startPolling(data.messageId, aiMsg);
            } else {
                finish("Ошибка сервера. Попробуйте позже.", aiMsg);
            }
        } catch (e) {
            console.error('Send error:', e);
            finish("Ошибка связи с сервером.", aiMsg);
        }
    }

    function startPolling(messageId, aiMsg) {
        let startTime = Date.now();
        pollController = new AbortController();

        const poll = async () => {
            if (activeMessageId !== messageId) return;
            
            try {
                const r = await fetch(`${API_URL}/get-answer/${messageId}`, { signal: pollController.signal });
                const d = await r.json();

                if (d.answer) {
                    finish(d.answer, aiMsg);
                } else if ((Date.now() - startTime) > 120000) {
                    finish("Время ожидания истекло.", aiMsg);
                } else {
                    pollTimeoutId = setTimeout(poll, 3000);
                }
            } catch (e) {
                if (e.name !== 'AbortError') pollTimeoutId = setTimeout(poll, 3000);
            }
        };
        poll();
    }

    function finish(text, msgElement) {
        if (msgElement) {
            msgElement.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text;
        }
        stopPolling();
    }

    async function loadChatHistory() {
        const box = document.getElementById('logai-msgs');
        try {
            const res = await fetch(`${API_URL}/history/${logSid}?platform=site`);
            const data = await res.json();
            box.innerHTML = '';
            if (Array.isArray(data) && data.length > 0) {
                data.forEach(m => {
                    if (m.message) addLogMsg(m.message, false);
                    if (m.answer) addLogMsg(m.answer, true);
                });
            } else {
                addLogMsg("Здравствуйте! Чем я могу вам помочь?", true);
            }
            historyLoaded = true;
        } catch (e) { console.error('History error:', e); }
    }</script></body></html>
